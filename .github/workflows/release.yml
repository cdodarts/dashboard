name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create release tarball
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          
          # Create tarball excluding unnecessary files
          tar -czf dashboard-${VERSION}.tar.gz \
            --exclude='.git*' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='backend/venv' \
            --exclude='frontend/node_modules' \
            --exclude='*.log' \
            --exclude='backend/data/*.db' \
            --exclude='backend/data/*.sqlite' \
            --transform "s,^,dashboard-${VERSION}/," \
            . 2>&1 | grep -v "file changed as we read it" || true
          
          echo "Created dashboard-${VERSION}.tar.gz"
          ls -lh dashboard-${VERSION}.tar.gz
      
      - name: Generate SHA256 checksum
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          sha256sum dashboard-${VERSION}.tar.gz > SHA256SUMS
          cat SHA256SUMS
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dashboard-*.tar.gz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
